name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: for f in public/assets/*.js lib/*.js $(find functions -name '*.js') scripts/*.mjs; do node --check "$f"; done
      - run: npm test
      - run: npm ci
      - run: npm run test:e2e
